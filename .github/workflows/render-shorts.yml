name: "Render shorts (dry-run: render + save artifact only)"

# Per 06_INFRA_SECRETS_AUTOPOST.md §3: "2 shorts/day per channel ...
# stagger channels across two daily cron triggers (a morning batch and an
# evening batch) rather than firing all 12 renders simultaneously." Both
# crons run the SAME job (same steps, same 6-channel matrix) -- one
# workflow, two schedule triggers, rather than two near-duplicate files.
#
# Times below (09:00 and 21:00 UTC, ~12h apart) are this build's own
# scheduling choice -- no specific hour was specified anywhere available to
# this session, so these are illustrative defaults, not a sourced
# requirement. Adjust freely.
#
# IMPORTANT, READ BEFORE ENABLING/RUNNING THIS WORKFLOW FOR REAL:
#
# 1. Phase 4 (roll out to the remaining 5 channels) is now done -- ALL 6
#    channels (CH1-CH6) have a real, registered Remotion composition (see
#    src/Root.tsx). CH1-CH5 use pipeline/render_channel_short.py's real
#    audio (TTS+naturalness+music+SFX+ducking+loudnorm) driving real
#    per-beat timing; CH6 is unchanged from Phase 3 (still silent,
#    pacing-bible-placeholder timing) -- see CLAUDE.md's Phase 4 section
#    for that stated asymmetry.
#
# 2. There is no automated script -> shot-brief -> TTS -> asset-sourcing
#    pipeline wired to run in CI. Every composition below is a hand-
#    authored, static, ALREADY-RENDERED short -- running this workflow
#    today re-renders the SAME 6 shorts every time, not new content. A
#    real 2x/day autopost cadence needs that generation pipeline built
#    and callable headlessly first; it does not exist yet.
#
# 3. This workflow deliberately stops at "render + save as a workflow
#    artifact" -- no YouTube upload step, per 06_INFRA_SECRETS_AUTOPOST.md
#    §4's DRY_RUN=true default and 07_REVIEW_GATE_PROTOCOL.md Gate 5's
#    requirement that a workflow run in this state BEFORE any upload step
#    is added. No YouTube upload script exists anywhere in this repo
#    (re-confirmed by search before this edit too), and the YT_CH{n}_*
#    OAuth secrets this would need are unconfirmed to even exist in this
#    repo's GitHub Settings (see CLAUDE.md's flagged conflict with
#    06_INFRA_SECRETS_AUTOPOST.md §2). There is still no privacyStatus
#    field, no auto-approve path, and no publish step of any kind anywhere
#    in this file -- the safest possible state, since there's no upload
#    step to gate in the first place. Do not add an upload step here
#    without resolving both first.
#
# 4. No real sourced imagery in any of the 6 shorts (NASA/Pexels/Pixabay/
#    Wikimedia/LOC egress is still blocked in this dev session -- every
#    beat's background is GradeTestBackground, the same non-shipping
#    placeholder used throughout this repo) and no real SFX/music-bed
#    LICENSING beyond what CLAUDE.md documents (music is real CC0-1.0;
#    SFX cues are still synthesized placeholders, not real assets).

on:
  schedule:
    - cron: "0 9 * * *"  # morning
    - cron: "0 21 * * *" # evening
  workflow_dispatch: {} # manual trigger, for testing without waiting on cron

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [CH1, CH2, CH3, CH4, CH5, CH6]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Resolve composition ID for this channel
        id: composition
        run: |
          case "${{ matrix.channel }}" in
            CH1) echo "id=CH1-dopamine-loop-notifications-001" >> "$GITHUB_OUTPUT" ;;
            CH2) echo "id=CH2-lottery-winners-broke-001" >> "$GITHUB_OUTPUT" ;;
            CH3) echo "id=CH3-mkultra-001" >> "$GITHUB_OUTPUT" ;;
            CH4) echo "id=CH4-fear-response-001" >> "$GITHUB_OUTPUT" ;;
            CH5) echo "id=CH5-wasp-pilots-001" >> "$GITHUB_OUTPUT" ;;
            CH6) echo "id=CH6-jupiter-red-spot-001" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Unknown channel ${{ matrix.channel }} -- no composition ID mapping in this workflow."
              exit 1
              ;;
          esac

      - name: Render
        run: npx remotion render src/index.ts "${{ steps.composition.outputs.id }}" "out/${{ matrix.channel }}.mp4"

      - uses: actions/upload-artifact@v4
        with:
          name: short-${{ matrix.channel }}
          path: out/${{ matrix.channel }}.mp4
          retention-days: 14

      # No YouTube upload step -- see the header comment above.
