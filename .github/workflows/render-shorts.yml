name: "Render + upload shorts (private only)"

# Per 06_INFRA_SECRETS_AUTOPOST.md §3: "2 shorts/day per channel ...
# stagger channels across two daily cron triggers (a morning batch and an
# evening batch) rather than firing all 12 renders simultaneously." Both
# crons run the SAME job (same steps, same 6-channel matrix) -- one
# workflow, two schedule triggers, rather than two near-duplicate files.
#
# Times below (09:00 and 21:00 UTC, ~12h apart) are this build's own
# scheduling choice -- no specific hour was specified anywhere available to
# this session, so these are illustrative defaults, not a sourced
# requirement. Adjust freely.
#
# IMPORTANT, READ BEFORE ENABLING/RUNNING THIS WORKFLOW FOR REAL:
#
# 1. All 6 channels (CH1-CH6) have a real, registered Remotion composition
#    (see src/Root.tsx). CH1-CH5 use pipeline/render_channel_short.py's
#    real audio (TTS+naturalness+music+SFX+ducking+loudnorm) driving real
#    per-beat timing; CH6 is unchanged from Phase 3 (still silent,
#    pacing-bible-placeholder timing) -- see CLAUDE.md's Phase 4 section.
#
# 2. UPDATED: the "Generate real audio + footage" step now actually runs
#    pipeline.render_channel_short (CH1-CH5) / pipeline.ch6_short_001
#    (CH6) before every render, replacing the committed audio/JSON with
#    freshly-generated output each run -- confirmed via a real CI run,
#    not assumed (see that step's own comment for exactly what it does
#    and doesn't cover). Script/beat CONTENT itself is still the
#    hand-authored BeatSpec lists in pipeline/channel_scripts.py /
#    pipeline/ch6_short_001.py, not LLM-generated -- no LLM provider is
#    wired into this path (keyword_extraction.py's NVIDIA NIM call is a
#    separate, still-unused module; footage keywords come straight from
#    those hand-authored BeatSpecs). So TTS audio, footage-sourcing
#    attempts, and SFX are all freshly (re)generated per run; the
#    underlying script text itself is not.
#
# 3. THIS WORKFLOW'S NAME CHANGED (was: "Render shorts (dry-run: render +
#    save artifact only)") because it now DOES upload -- see the "Upload
#    to YouTube" step below. It still does NOT make anything public: the
#    upload step hardcodes privacyStatus=private as a Python literal in
#    pipeline/youtube_upload.py (`PRIVACY_STATUS = "private"`, read by
#    nothing else, overridable by nothing in this workflow -- no env var,
#    input, or secret controls it). There is no `videos().update()` call,
#    no publish/approve step, and no privacyStatus value anywhere in this
#    file or pipeline/youtube_upload.py other than that one hardcoded
#    "private" literal -- checked via `grep -i privacyStatus` across both
#    before writing this, not assumed.
#
# 4. Needs 18 real per-channel secrets to actually succeed:
#    YT_CH{1-6}_CLIENT_ID / _CLIENT_SECRET / _REFRESH_TOKEN, per
#    06_INFRA_SECRETS_AUTOPOST.md §2's naming. This repo has never had
#    visibility into whether these are configured (secret NAMES aren't
#    readable via this session's GitHub access either -- confirmed via a
#    direct API call, 403 "Access to this GitHub Actions path is not
#    permitted through this proxy"). If they're missing, the upload step
#    fails LOUD with a clear "missing secret" error (see
#    pipeline/youtube_upload.py's `_creds_from_env()`) -- it does NOT
#    silently skip. Until those secrets are added, every scheduled run of
#    this workflow will show a red X on the upload step for all 6
#    channels; that's expected, not a bug, and was not silently hidden by
#    making the step soft-fail.
#
# 5. Footage-sourcing (NASA/Pexels/Pixabay/Wikimedia/LOC) is now attempted
#    for real from this workflow's own generation step -- whether any of
#    those hosts are actually reachable from a GitHub Actions runner
#    (unlike this repo's original dev sandbox, which blocked all of them)
#    is confirmed per-run from that step's own log, not assumed here.
#    Falls back to GradeTestBackground, labeled with the real rejection
#    reason, per beat, if a given attempt doesn't clear confidence
#    threshold or errors. No real SFX asset library exists yet either way
#    (music is real CC0-1.0; SFX cues are still synthesized placeholder
#    tones -- unchanged, out of scope for the generation-step work).

on:
  schedule:
    - cron: "0 9 * * *"  # morning
    - cron: "0 21 * * *" # evening
  workflow_dispatch: {} # manual trigger, for testing without waiting on cron
  push:
    branches:
      - claude/python-pipeline-ci-integration-pddboc
    # TEMPORARY, remove once CI pipeline testing is done: the GitHub App
    # integration used by this session lacks permission to POST
    # .../dispatches (confirmed 403 "Resource not accessible by
    # integration"), so pushes to this dev branch are used to trigger runs
    # instead during this pass.

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [CH1, CH2, CH3, CH4, CH5, CH6]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Resolve composition ID and metadata path for this channel
        id: composition
        run: |
          case "${{ matrix.channel }}" in
            CH1) echo "id=CH1-dopamine-loop-notifications-001" >> "$GITHUB_OUTPUT"
                 echo "data_file=src/remotion/data/ch1-dopamine-loop-notifications-001.json" >> "$GITHUB_OUTPUT" ;;
            CH2) echo "id=CH2-lottery-winners-broke-001" >> "$GITHUB_OUTPUT"
                 echo "data_file=src/remotion/data/ch2-lottery-winners-broke-001.json" >> "$GITHUB_OUTPUT" ;;
            CH3) echo "id=CH3-mkultra-001" >> "$GITHUB_OUTPUT"
                 echo "data_file=src/remotion/data/ch3-mkultra-001.json" >> "$GITHUB_OUTPUT" ;;
            CH4) echo "id=CH4-fear-response-001" >> "$GITHUB_OUTPUT"
                 echo "data_file=src/remotion/data/ch4-fear-response-001.json" >> "$GITHUB_OUTPUT" ;;
            CH5) echo "id=CH5-wasp-pilots-001" >> "$GITHUB_OUTPUT"
                 echo "data_file=src/remotion/data/ch5-wasp-pilots-001.json" >> "$GITHUB_OUTPUT" ;;
            CH6) echo "id=CH6-jupiter-red-spot-001" >> "$GITHUB_OUTPUT"
                 echo "data_file=src/remotion/data/ch6-jupiter-red-spot-001.json" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Unknown channel ${{ matrix.channel }} -- no composition ID mapping in this workflow."
              exit 1
              ;;
          esac

      # Real generation: TTS (edge-tts tried first, espeak-ng logged
      # fallback) + real per-channel footage-sourcing attempt (pexels/
      # pixabay need keys below; wikimedia/loc/nasa need none, only
      # egress) + the existing baked-tone SFX/ducking/loudnorm chain.
      # Writes fresh public/audio/<short_id>.wav + src/remotion/data/
      # <short_id>.json, REPLACING whatever was already committed --
      # Render (next step) reads whatever this step just wrote. Any
      # uncaught exception here fails this step (and the job) loud; there
      # is no silent fallback to the old committed files.
      - name: Generate real audio + footage (Python pipeline)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          if [ "${{ matrix.channel }}" = "CH6" ]; then
            python3 -m pipeline.ch6_short_001
          else
            python3 -m pipeline.render_channel_short "${{ matrix.channel }}"
          fi

      # TEMPORARY diagnostic, remove once confirmed: pixabay is CH1/CH2/CH4's
      # SECONDARY source (only called when pexels returns zero candidates
      # for a beat, which hasn't happened yet in real runs), so it's never
      # been exercised end-to-end despite the key being present. Gated to
      # one matrix job since it doesn't depend on channel-specific content.
      - name: "DIAGNOSTIC (temporary): probe pixabay directly"
        if: matrix.channel == 'CH1'
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python3 -m pipeline.footage_sourcing.probe_pixabay

      - name: Render
        run: npx remotion render src/index.ts "${{ steps.composition.outputs.id }}" "out/${{ matrix.channel }}.mp4"

      - uses: actions/upload-artifact@v4
        with:
          name: short-${{ matrix.channel }}
          path: out/${{ matrix.channel }}.mp4
          retention-days: 14

      # Uploads to YouTube as an UNLISTED-FROM-PUBLIC "private" video --
      # see point 3 in the header comment for exactly where and how that's
      # enforced. `if: success()` makes explicit (matches the default
      # behavior, but stated so it's not just implicit) that this only
      # runs if every prior step in THIS channel's job succeeded --
      # `out/${{ matrix.channel }}.mp4` is the exact path the Render step
      # above just produced, read directly, not a separately-guessed
      # path. `strategy.fail-fast: false` above means a render/upload
      # failure for one channel's matrix job does not cancel or block the
      # other 5 channels' independent jobs.
      - name: Upload to YouTube (private)
        if: success()
        env:
          YT_CH1_CLIENT_ID: ${{ secrets.YT_CH1_CLIENT_ID }}
          YT_CH1_CLIENT_SECRET: ${{ secrets.YT_CH1_CLIENT_SECRET }}
          YT_CH1_REFRESH_TOKEN: ${{ secrets.YT_CH1_REFRESH_TOKEN }}
          YT_CH2_CLIENT_ID: ${{ secrets.YT_CH2_CLIENT_ID }}
          YT_CH2_CLIENT_SECRET: ${{ secrets.YT_CH2_CLIENT_SECRET }}
          YT_CH2_REFRESH_TOKEN: ${{ secrets.YT_CH2_REFRESH_TOKEN }}
          YT_CH3_CLIENT_ID: ${{ secrets.YT_CH3_CLIENT_ID }}
          YT_CH3_CLIENT_SECRET: ${{ secrets.YT_CH3_CLIENT_SECRET }}
          YT_CH3_REFRESH_TOKEN: ${{ secrets.YT_CH3_REFRESH_TOKEN }}
          YT_CH4_CLIENT_ID: ${{ secrets.YT_CH4_CLIENT_ID }}
          YT_CH4_CLIENT_SECRET: ${{ secrets.YT_CH4_CLIENT_SECRET }}
          YT_CH4_REFRESH_TOKEN: ${{ secrets.YT_CH4_REFRESH_TOKEN }}
          YT_CH5_CLIENT_ID: ${{ secrets.YT_CH5_CLIENT_ID }}
          YT_CH5_CLIENT_SECRET: ${{ secrets.YT_CH5_CLIENT_SECRET }}
          YT_CH5_REFRESH_TOKEN: ${{ secrets.YT_CH5_REFRESH_TOKEN }}
          YT_CH6_CLIENT_ID: ${{ secrets.YT_CH6_CLIENT_ID }}
          YT_CH6_CLIENT_SECRET: ${{ secrets.YT_CH6_CLIENT_SECRET }}
          YT_CH6_REFRESH_TOKEN: ${{ secrets.YT_CH6_REFRESH_TOKEN }}
        run: |
          python3 -m pipeline.youtube_upload \
            "${{ matrix.channel }}" \
            "out/${{ matrix.channel }}.mp4" \
            "${{ steps.composition.outputs.data_file }}"
